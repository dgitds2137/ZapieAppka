name: Flutter frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "zapieapp/**"
      - ".github/workflows/flutter-frontend-ci.yml"
  pull_request:
    paths:
      - "zapieapp/**"
      - ".github/workflows/flutter-frontend-ci.yml"
  workflow_dispatch:

concurrency:
  group: flutter-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zapieapp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
