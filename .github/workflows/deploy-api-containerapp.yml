name: Deploy API to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "my_fastapi_project/**"
      - ".github/workflows/deploy-api-containerapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-main
  cancel-in-progress: true

env:
  APP_SOURCE_PATH: my_fastapi_project
  IMAGE_REPOSITORY: zapieapp-api
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
  AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
  AZURE_CONTAINER_APP_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }}

jobs:
  deploy:
    name: Build and deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate workflow variables
        shell: bash
        run: |
          missing=0
          for name in \
            AZURE_RESOURCE_GROUP \
            AZURE_CONTAINER_REGISTRY_NAME \
            AZURE_CONTAINER_APP_NAME \
            AZURE_CONTAINER_APP_ENVIRONMENT
          do
            if [ -z "${!name}" ]; then
              echo "::error::Set GitHub Actions variable $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate FastAPI package
        working-directory: my_fastapi_project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall .
          python - <<'PY'
          from fastapi.testclient import TestClient
          import main

          response = TestClient(main.app).get("/health")
          response.raise_for_status()
          print(response.json())
          PY

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure resources
        shell: bash
        run: |
          az acr show \
            --name "$AZURE_CONTAINER_REGISTRY_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query loginServer \
            --output tsv

          az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query name \
            --output tsv

          for secret_name in mssql-conn-str jwt-secret-key; do
            count="$(az containerapp secret list \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?name=='$secret_name'] | length(@)" \
              --output tsv)"
            if [ "$count" != "1" ]; then
              echo "::error::Missing Container App secret: $secret_name"
              exit 1
            fi
          done

      - name: Prepare runtime environment variables
        id: prepare-runtime-env
        shell: bash
        run: |
          secret_count() {
            az containerapp secret list \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?name=='$1'] | length(@)" \
              --output tsv
          }

          append_if_group_complete() {
            local label="$1"
            shift
            local secret_names=("$@")
            local existing=0
            local missing=()

            for secret_name in "${secret_names[@]}"; do
              count="$(secret_count "$secret_name")"
              if [ "$count" = "1" ]; then
                existing=$((existing + 1))
              else
                missing+=("$secret_name")
              fi
            done

            if [ "$existing" = "0" ]; then
              return 0
            fi

            if [ "$existing" != "${#secret_names[@]}" ]; then
              echo "::error::$label auth secrets are only partially configured. Missing: ${missing[*]}"
              exit 1
            fi

            return 0
          }

          google_secret_names=(
            google-auth-client-id
            google-auth-client-secret
            google-auth-default-redirect-uri
            google-auth-allowed-redirect-uris
          )

          apple_secret_names=(
            apple-auth-client-id
            apple-auth-team-id
            apple-auth-key-id
            apple-auth-private-key
            apple-auth-callback-bridge-uri
            apple-auth-default-redirect-uri
            apple-auth-allowed-redirect-uris
          )

          append_if_group_complete "Google" "${google_secret_names[@]}"
          append_if_group_complete "Apple" "${apple_secret_names[@]}"

          {
            echo "environment_variables<<EOF"
            echo "APP_ENV=production"
            echo "PORT=8000"
            echo "REQUIRE_DATABASE_ON_STARTUP=false"
            echo "MSSQL_CONN_STR=secretref:mssql-conn-str"
            echo "JWT_SECRET_KEY=secretref:jwt-secret-key"

            if [ "$(secret_count google-auth-client-id)" = "1" ]; then
              echo "GOOGLE_AUTH_CLIENT_ID=secretref:google-auth-client-id"
              echo "GOOGLE_AUTH_CLIENT_SECRET=secretref:google-auth-client-secret"
              echo "GOOGLE_AUTH_DEFAULT_REDIRECT_URI=secretref:google-auth-default-redirect-uri"
              echo "GOOGLE_AUTH_ALLOWED_REDIRECT_URIS=secretref:google-auth-allowed-redirect-uris"
              echo "GOOGLE_AUTH_STATE_TTL_SECONDS=600"
            fi

            if [ "$(secret_count apple-auth-client-id)" = "1" ]; then
              echo "APPLE_AUTH_CLIENT_ID=secretref:apple-auth-client-id"
              echo "APPLE_AUTH_TEAM_ID=secretref:apple-auth-team-id"
              echo "APPLE_AUTH_KEY_ID=secretref:apple-auth-key-id"
              echo "APPLE_AUTH_PRIVATE_KEY=secretref:apple-auth-private-key"
              echo "APPLE_AUTH_CALLBACK_BRIDGE_URI=secretref:apple-auth-callback-bridge-uri"
              echo "APPLE_AUTH_DEFAULT_REDIRECT_URI=secretref:apple-auth-default-redirect-uri"
              echo "APPLE_AUTH_ALLOWED_REDIRECT_URIS=secretref:apple-auth-allowed-redirect-uris"
              echo "APPLE_AUTH_STATE_TTL_SECONDS=600"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and deploy container app
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}/my_fastapi_project
          dockerfilePath: Dockerfile
          acrName: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          imageToBuild: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/zapieapp-api:${{ github.sha }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }}
          targetPort: 8000
          ingress: external
          environmentVariables: ${{ steps.prepare-runtime-env.outputs.environment_variables }}
          disableTelemetry: true

      - name: Reapply runtime environment variables
        shell: bash
        run: |
          ENV_VARS="$(printf '%s\n' "${{ steps.prepare-runtime-env.outputs.environment_variables }}")"
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars $(printf '%s\n' "$ENV_VARS" | xargs)

      - name: Smoke test deployed API
        shell: bash
        run: |
          fqdn="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "https://$fqdn/health"; then
              echo
              echo "API is healthy at https://$fqdn"
              exit 0
            fi
            sleep 5
          done

          echo "::error::API health check failed at https://$fqdn/health"
          exit 1
